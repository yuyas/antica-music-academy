<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>アンティカ音楽学院 | サイト更新のお知らせ</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --text: #2f2618;
      --text-muted: #5e503e;
      --accent: #8b6b3f;
      --line: #ddcfba;
      --radius: 16px;
      --shadow: 0 16px 38px rgba(70, 49, 20, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 85% 0%, rgba(139, 107, 63, 0.1) 0%, rgba(139, 107, 63, 0) 42%),
        linear-gradient(180deg, #ffffff 0%, #fbf8f3 100%);
      color: var(--text);
      font-family: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
      line-height: 1.75;
    }

    .wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
    }

    .card {
      width: min(100%, 560px);
      text-align: center;
      border: 1px solid rgba(139, 107, 63, 0.28);
      border-radius: var(--radius);
      background:
        linear-gradient(145deg, rgba(139, 107, 63, 0.1), rgba(139, 107, 63, 0.03)),
        #ffffff;
      box-shadow: var(--shadow);
      padding: 48px 32px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .brand-icon {
      width: 28px;
      height: auto;
    }

    .brand-wordmark {
      width: clamp(160px, 42vw, 260px);
      height: auto;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(1.35rem, 3vw, 1.8rem);
      font-weight: 500;
      letter-spacing: 0.06em;
      line-height: 1.5;
    }

    p {
      margin: 0 0 12px;
      color: var(--text-muted);
    }

    .contact {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      font-size: 0.92rem;
    }

  </style>
</head>
<body>
  <main class="wrap">
    <div class="card">
      <div class="brand">
        <img class="brand-icon" src="LOGO.svg" alt="" aria-hidden="true">
        <img class="brand-wordmark" src="アンティカ音楽学院.svg" alt="アンティカ音楽学院">
      </div>
      <h1>ただいまサイトを<br>更新しています</h1>
      <p>アンティカ音楽学院のホームページは、ただいま内容を更新しております。</p>
      <p>公開まで今しばらくお待ちください。</p>
      <p class="contact">お問い合わせ: <a href="mailto:info@antica-music-academy.jp">info@antica-music-academy.jp</a></p>
    </div>
  </main>
</body>
</html>
