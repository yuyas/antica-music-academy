<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>美しすぎる音楽家たちの饗宴 | News | Antica Music Academy</title>
  <meta name="description" content="アンティカ音楽学院presents 美しすぎる音楽家たちの饗宴のご案内。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Noto+Serif+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f5f2;
      --panel-soft: #fffdf8;
      --text: #2f2618;
      --text-muted: #5e503e;
      --line: #ddcfba;
      --accent: #8b6b3f;
      --accent-deep: #6f5532;
      --max-width: 980px;
      --radius: 16px;
      --shadow: 0 16px 38px rgba(70, 49, 20, 0.12);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      padding: 0;
      background:
        radial-gradient(circle at 85% 0%, rgba(139, 107, 63, 0.1) 0%, rgba(139, 107, 63, 0) 42%),
        linear-gradient(180deg, #ffffff 0%, #fbf8f3 100%);
      color: var(--text);
      font-family: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
      line-height: 1.9;
      letter-spacing: 0.01em;
    }

    a { color: inherit; text-decoration: none; }

    .container {
      width: min(100% - 40px, var(--max-width));
      margin-inline: auto;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid rgba(139, 107, 63, 0.22);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
    }

    .header-inner {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
    }

    .brand-icon {
      width: 28px;
      height: auto;
      display: block;
    }

    .brand-wordmark {
      width: clamp(170px, 26vw, 262px);
      height: auto;
      display: block;
    }

    .back-link {
      color: var(--accent);
      font-size: 0.95rem;
      letter-spacing: 0.08em;
    }

    main {
      padding: 72px 0 96px;
    }

    .news-hero {
      border-bottom: 1px solid var(--line);
      padding-bottom: 28px;
      margin-bottom: 34px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      color: var(--accent);
      font-family: "Cormorant Garamond", serif;
      font-size: 1rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-style: italic;
    }

    .new-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px 11px;
      border: 1px solid rgba(139, 107, 63, 0.32);
      border-radius: 999px;
      color: #fff;
      background: var(--accent);
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      line-height: 1.2;
      text-transform: uppercase;
      font-style: normal;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.35rem);
      font-weight: 500;
      line-height: 1.42;
      letter-spacing: 0.04em;
    }

    .lead {
      margin: 22px 0 0;
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    .event-visuals {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
      align-items: start;
      margin: 0 0 28px;
    }

    .event-visual {
      overflow: hidden;
      border: 1px solid rgba(139, 107, 63, 0.24);
      border-radius: var(--radius);
      background: var(--panel-soft);
      box-shadow: var(--shadow);
    }

    .event-visual img {
      display: block;
      width: 100%;
      height: auto;
    }

    .event-card {
      border: 1px solid rgba(139, 107, 63, 0.24);
      border-radius: var(--radius);
      background:
        linear-gradient(145deg, rgba(139, 107, 63, 0.08), rgba(139, 107, 63, 0.02)),
        var(--panel-soft);
      box-shadow: var(--shadow);
      padding: clamp(24px, 5vw, 44px);
    }

    .event-title {
      margin: 0;
      font-size: clamp(1.2rem, 2.4vw, 1.6rem);
      line-height: 1.8;
      font-weight: 600;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 20px;
      border: 1px solid rgba(139, 107, 63, 0.35);
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(120deg, #9a7751, #7c6039);
      font-weight: 700;
    }

    @media (max-width: 768px) {
      .container { width: min(100% - 40px, var(--max-width)); }
      main { padding: 48px 0 72px; }
      .header-inner { min-height: 68px; }
      .brand-wordmark { width: clamp(180px, 58vw, 250px); }
      .event-visuals { grid-template-columns: 1fr; }
      .event-card { padding: 24px 20px; }
      .button-row { display: grid; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="../../index.html#news" aria-label="Antica Music Academy トップへ">
        <img class="brand-icon" src="../../LOGO.svg" alt="" aria-hidden="true">
        <img class="brand-wordmark" src="../../アンティカ音楽学院.svg" alt="アンティカ音楽学院">
      </a>
      <a class="back-link" href="../../index.html#news">Newsへ戻る</a>
    </div>
  </header>

  <main>
    <div class="container">
      <section class="news-hero">
        <span class="eyebrow">News <span class="new-badge">NEW</span></span>
        <h1>アンティカ音楽学院presents<br>美しすぎる音楽家たちの饗宴</h1>
        <p class="lead">2026年10月6日開催イベントのご案内です。</p>
      </section>

      <section class="event-visuals" aria-label="イベントフライヤー">
        <figure class="event-visual">
          <img src="../../images/october-2026/beautiful-musicians-banquet-1.jpg" alt="アンティカ音楽学院presents 美しすぎる音楽家たちの饗宴 フライヤー表面">
        </figure>
        <figure class="event-visual">
          <img src="../../images/october-2026/beautiful-musicians-banquet-2.jpg" alt="アンティカ音楽学院presents 美しすぎる音楽家たちの饗宴 フライヤー詳細">
        </figure>
      </section>

      <section class="event-card">
        <p class="event-title">アンティカ音楽学院presents<br>美しすぎる音楽家たちの饗宴</p>
        <div class="button-row">
          <a class="button" href="../../20261006_beautiful_musicians_flyer.pdf" target="_blank" rel="noopener noreferrer">PDFを開く</a>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
